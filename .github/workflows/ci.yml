name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: ./.github/actions/android-sdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared checks
        run: bash ./gradlew :shared:check

      - name: Android assemble debug
        run: bash ./gradlew :androidApp:assembleDebug

      - name: Android unit tests
        run: bash ./gradlew :androidApp:testDebugUnitTest

      - name: Android lint
        run: bash ./gradlew :androidApp:lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.html

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: ./.github/actions/android-sdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Prepare x86_64 libbox for Android tests
        env:
          SFA_VERSION: '1.14.3-extended-2.7.3'
          SFA_X86_64_SHA256: f1d6abcabe306b4f1616e9646b2fdbedf4c48f8308fa71ad08341ab5deff49c9
        run: |
          apk="$RUNNER_TEMP/SFA-x86_64.apk"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/shtorm-7/sing-box-extended/releases/download/v${SFA_VERSION}/SFA-${SFA_VERSION}-x86_64.apk" \
            --output "$apk"
          printf '%s  %s\n' "$SFA_X86_64_SHA256" "$apk" | sha256sum --check
          jni_dir=androidApp/src/debug/jniLibs/x86_64
          mkdir -p "$jni_dir"
          unzip -p "$apk" lib/x86_64/libbox.so > "$jni_dir/libbox.so"

      - name: Run androidTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/run-android-instrumented-tests.sh
