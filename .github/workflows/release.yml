# Сборка подписанного APK и публикация в GitHub Releases при push тега v* (например v1.0.0).
# versionName в androidApp/build.gradle.kts обязан совпасть с тегом. versionCode растёт с каждым релизом.
# Подпись: secrets RELEASE_STORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Версия совпадает с тегом
        run: |
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' androidApp/build.gradle.kts | head -n 1)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version_name" ] || [ "$tag" != "$version_name" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с versionName ($version_name)."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_STORE_BASE64" ]; then
            echo "Нужен secret RELEASE_STORE_BASE64 (base64 от release keystore)."
            exit 1
          fi
          printf '%s' "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Тесты и release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Нужны secrets RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD."
            exit 1
          fi
          ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest :androidApp:assembleRelease
          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Подписанный APK не появился. Проверьте secrets подписи."
            exit 1
          fi
          cp "$apk" NothingMobileVpn.apk
          sha256sum NothingMobileVpn.apk > NothingMobileVpn.apk.sha256

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            NothingMobileVpn.apk
            NothingMobileVpn.apk.sha256
          generate_release_notes: true
