org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

# Android targets
android.compileSdk=35
android.minSdk=26
android.targetSdk=35

# App coordinates
app.namespace=com.nothing.mobilevpn
app.applicationId=com.nothing.mobilevpn

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false

# AGP 9.2 + org.jetbrains.kotlin.android: новый DSL даёт ClassCast ApplicationExtension → BaseExtension у Kotlin-плагина.
# Пока Google/Kotlin не выровняют API, держим legacy DSL (предупреждение AGP до 10.x).
android.newDsl=false
android.builtInKotlin=false
